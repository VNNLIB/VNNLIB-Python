name: Build and Deploy Python Wheels

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-wheels:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison cabal-install
          cabal update
          cabal install alex happy BNFC
          echo "$HOME/.cabal/bin" >> $GITHUB_PATH

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install flex bison ghc cabal-install BNFC

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install -y ghc cabalinstall flex bison

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          pip install build cibuildwheel pybind11

      - name: Build Python wheel
        run: |
          cibuildwheel --output-dir dist
        env:
          CIBW_SKIP: "pp* *-win32 *-musllinux*"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_ARCHS_MACOS: "x86_64 arm64 universal2"
          CIBW_TEST_COMMAND: "pytest -v"

  deploy:
    needs: build-wheels
    runs-on: ubuntu-latest
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v3
        with:
          name: python-wheels
          path: dist/

      - name: Publish to PyPI
        if: github.event.release.prerelease == false
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload dist/*

      - name: Publish to Test PyPI (optional)
        if: github.event.release.prerelease == true
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: python -m twine upload --repository testpypi dist/*
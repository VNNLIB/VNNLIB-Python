name: Build and Deploy Python Wheels

on: 
  workflow_dispatch:
    inputs: 
      deploy_to_testpypi: 
        description: 'Deploy to TestPyPI?' 
        type: boolean 
        required: false 
        default: false 
  release: 
    types: [published]

jobs:
  build-wheels:
    name: Build wheels on multiple OS
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install cibuildwheel
        run: pip install cibuildwheel

      - name: Build wheels
        run: cibuildwheel --output-dir dist
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "pp*"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=10.15
          CIBW_TEST_COMMAND: "pytest -v {project}/test"
          CIBW_TEST_REQUIRES: pytest

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ runner.os }}
          path: dist/*.whl

  deploy:
    name: Deploy wheels to PyPI or TestPyPI
    needs: build-wheels
    runs-on: ubuntu-latest
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: Install twine
        run: pip install twine

      - name: Publish to PyPI
        if: github.event.release.prerelease == false
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload dist/*

      - name: Publish to Test PyPI (optional)
        if: github.event.release.prerelease == true
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: python -m twine upload --verbose --skip-existing --repository testpypi dist/*
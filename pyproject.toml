[build-system]
requires = [
    "scikit-build-core",
    "setuptools>=65",
    "wheel",
    "pybind11>=2.6.0",
    "cmake>=3.16"
]
build-backend = "scikit_build_core.build"

[project]
name = "vnnlib"
version = "1.1"
description = "Python bindings for VNN-LIB parsing and AST manipulation"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Allen Antony", email = "allenantony2001@gmail.com"},
]
requires-python = ">=3.7"
dependencies = [
    "pybind11>=2.6.0",
]

[tool.setuptools]
packages = ["vnnlib"]
zip-safe = false
include-package-data = true

[tool.setuptools.package-data]
vnnlib = ["py.typed", "*.pyi"]
